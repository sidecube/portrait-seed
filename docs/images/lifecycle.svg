<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Temporary input, retained generated output</title><desc id="desc">The camera worker ends after analysis, or is terminated within 600 seconds including startup. New paid calls expire ten minutes after capture. Generated images and descriptions are retained.</desc>
<rect width="1200" height="510" fill="#f7f4ed"/>
<g font-family="Arial,sans-serif" fill="#202522">
<text x="42" y="54" font-size="30" font-weight="bold">Temporary input ≠ temporary collection</text>
<path d="M345 100V424M845 100V424" stroke="#b9beb6" stroke-dasharray="4 5"/>
<text x="360" y="107" font-size="17">Capture</text><text x="860" y="107" font-size="17">10 minutes after capture</text>
<text x="42" y="171" font-size="20" font-weight="bold">Camera / analysis worker</text>
<rect x="295" y="141" width="300" height="42" rx="5" fill="#607c65"/>
<text x="310" y="169" font-size="16" fill="#fff">Ends after local description</text>
<text x="360" y="207" font-size="16">Parent timeout: 600 s including camera startup</text>
<text x="42" y="270" font-size="20" font-weight="bold">New paid image calls</text>
<rect x="595" y="240" width="250" height="42" rx="5" fill="#315a85"/>
<text x="609" y="268" font-size="16" fill="#fff">Up to 3 total attempts</text>
<text x="862" y="268" font-size="16">No new submission</text>
<text x="595" y="307" font-size="16">An in-flight request may finish after the deadline</text>
<text x="42" y="365" font-size="20" font-weight="bold">Generated collection</text>
<path d="M690 355H1120" stroke="#315a85" stroke-width="35"/>
<path d="M1120 330L1150 355L1120 380Z" fill="#315a85"/>
<text x="705" y="361" font-size="16" fill="#fff">PNG + descriptions retained</text>
<text x="690" y="410" font-size="16">No automatic expiry of generated results</text>
<text x="42" y="467" font-size="16">No deliberate raw-photo files. Local model memory, OS swap/dumps and provider-side data have separate lifecycles.</text>
</g></svg>
