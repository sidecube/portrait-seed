[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portrait-seed"
version = "0.1.0"
description = "A small, auditable camera-to-portrait pipeline with local visual analysis."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Deian Berar"}]
dependencies = ["Pillow>=10,<13", "httpx>=0.27,<1", "openai>=2,<3", "opencv-python-headless>=4.10,<5"]

[project.scripts]
portrait-seed = "portrait_seed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

